name: Deploy Upandcomer Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upandcomer-mobile/package-lock.json

      - name: Install dependencies
        working-directory: upandcomer-mobile
        run: npm ci

      - name: Build website
        working-directory: upandcomer-mobile
        run: npx expo export --platform web

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: upandcomer-mobile/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
